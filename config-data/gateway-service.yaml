server:
  port: 8080
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: true

spring:
  cloud:
    gateway:
      discovery:
        locator:
          # Permet de router automatiquement via /SERVICE-NAME/endpoint
          enabled: true  
          # Important : Eureka met souvent les noms en MAJUSCULES (ex: CATEGORY-SERVICE)
          # Cette option permet d'appeler l'URL en minuscules
          lower-case-service-id: true 
      routes:
        - id: category-service
          uri: lb://category-service
          predicates:
            - Path=/api/categories/**
          # Optionnel : Ajoutez un filtre si votre microservice ne s'attend pas au préfixe /categories
          # filters:
          #   - StripPrefix=1        
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
          # Optionnel : Ajoutez un filtre si votre microservice ne s'attend pas au préfixe /products
          # filters:
          #   - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: "gateway,health,info,refresh,env,refresh,routes"

logging:
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - [${spring.application.name}] - %msg%n"


